<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Orang Tua - SD IT AL-IQRA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200 text-center">
      <div class="w-16 h-16 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">📖</div>
      <h2 class="text-xl font-bold text-teal-800">SD IT AL-IQRA</h2>
      <p class="text-xs text-slate-500 mb-6">Portal Orang Tua & Siswa</p>
      
      <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">ID Siswa (contoh: S001)</label>
          <input type="text" id="login-id" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-teal-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">PIN Login</label>
          <input type="password" id="login-pin" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-teal-500">
        </div>
        <button type="submit" class="w-full bg-teal-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-teal-700">Masuk Aplikasi</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="hidden pb-20">
    <nav class="bg-teal-700 text-white p-4 sticky top-0 z-50 shadow-md">
      <div class="max-w-md mx-auto flex justify-between items-center">
        <div>
          <h1 id="user-nama" class="font-bold text-base">Nama Siswa</h1>
          <p id="user-id" class="text-xs text-teal-200">ID: -</p>
        </div>
        <button onclick="logout()" class="text-xs bg-teal-800 px-3 py-1.5 rounded-lg border border-teal-500">Keluar</button>
      </div>
    </nav>

    <main class="max-w-md mx-auto p-4 space-y-6">
      <!-- Navigasi Tab -->
      <div class="flex space-x-2 border-b border-slate-300 pb-2 overflow-x-auto">
        <button onclick="switchTabOrtu('pengumuman')" id="tabo-pengumuman" class="px-3 py-1.5 font-semibold rounded-lg bg-teal-700 text-white text-xs whitespace-nowrap">📢 Pengumuman</button>
        <button onclick="switchTabOrtu('materi')" id="tabo-materi" class="px-3 py-1.5 font-semibold rounded-lg bg-white text-slate-600 text-xs whitespace-nowrap">📚 Materi</button>
        <button onclick="switchTabOrtu('mutabaah')" id="tabo-mutabaah" class="px-3 py-1.5 font-semibold rounded-lg bg-white text-slate-600 text-xs whitespace-nowrap">📝 Mutaba'ah</button>
        <button onclick="switchTabOrtu('izin')" id="tabo-izin" class="px-3 py-1.5 font-semibold rounded-lg bg-white text-slate-600 text-xs whitespace-nowrap">✉️ Kirim Izin</button>
      </div>

      <!-- TAB PENGUMUMAN -->
      <div id="seco-pengumuman" class="space-y-4">
        <div id="list-pengumuman" class="space-y-3">
          <p class="text-xs text-slate-500">Memuat pengumuman...</p>
        </div>
      </div>

      <!-- TAB MATERI -->
      <div id="seco-materi" class="space-y-4 hidden">
        <div id="list-materi" class="space-y-4">
          <p class="text-xs text-slate-500">Memuat materi pembelajaran...</p>
        </div>
      </div>

      <!-- TAB MUTABAAH -->
      <div id="seco-mutabaah" class="space-y-4 hidden">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <h3 class="font-bold text-sm text-teal-800 mb-2">Riwayat Mutaba'ah Harian</h3>
          <div id="list-mutabaah" class="space-y-3">
            <p class="text-xs text-slate-500">Memuat data mutaba'ah...</p>
          </div>
        </div>
      </div>

      <!-- TAB IZIN -->
      <div id="seco-izin" class="space-y-4 hidden">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <h3 class="font-bold text-sm text-teal-800 mb-3">Kirim Surat Izin / Sakit</h3>
          <form onsubmit="handleSendIzin(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Tanggal Izin</label>
              <input type="date" id="iz-tanggal" required class="w-full p-2 border rounded-lg text-xs outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Jenis Izin</label>
              <select id="iz-jenis" required class="w-full p-2 border rounded-lg text-xs outline-none">
                <option value="Sakit">Sakit</option>
                <option value="Izin Acara Keluarga">Izin Acara Keluarga</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Alasan / Keterangan</label>
              <textarea id="iz-alasan" rows="3" required class="w-full p-2 border rounded-lg text-xs outline-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-teal-600 text-white py-2 rounded-lg font-bold text-xs hover:bg-teal-700">Kirim Surat Izin</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwVmfmObDSAeEHPEoRIysEDZkl_1vZtfhgp8WCVADMnwJOmT8yMdnl07JmTqRDtyrq8UA/exec";
    let currentSiswa = null;

    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("siswa_session");
      if (saved) {
        currentSiswa = JSON.parse(saved);
        showApp();
      }
    });

    function formatDateIndo(dateStr) {
      if (!dateStr || dateStr === '-') return '-';
      let cleanStr = String(dateStr).trim();
      if (cleanStr.includes('T')) cleanStr = cleanStr.split('T')[0];
      const parts = cleanStr.split('-');
      if (parts.length === 3) {
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10))
          .toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      }
      return dateStr;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const payload = {
        action: 'login',
        siswaId: document.getElementById('login-id').value,
        pin: document.getElementById('login-pin').value
      };
      
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      const data = await res.json();
      
      if (data.status === 'success') {
        currentSiswa = data.siswa;
        localStorage.setItem("siswa_session", JSON.stringify(currentSiswa));
        showApp();
      } else {
        alert(data.message || 'Login gagal!');
      }
    }

    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('user-nama').innerText = currentSiswa.nama;
      document.getElementById('user-id').innerText = `ID: ${currentSiswa.id}`;
      document.getElementById('iz-tanggal').value = new Date().toISOString().split('T')[0];
      
      loadPengumuman();
      loadMateri();
      loadMutabaah();
    }

    function logout() {
      localStorage.removeItem("siswa_session");
      location.reload();
    }

    function switchTabOrtu(tab) {
      ['pengumuman', 'materi', 'mutabaah', 'izin'].forEach(t => {
        document.getElementById(`seco-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`tabo-${t}`);
        btn.className = (t === tab) ? 
          "px-3 py-1.5 font-semibold rounded-lg bg-teal-700 text-white text-xs whitespace-nowrap" : 
          "px-3 py-1.5 font-semibold rounded-lg bg-white text-slate-600 text-xs whitespace-nowrap";
      });
    }

    async function loadPengumuman() {
      try {
        const res = await fetch(`${API_URL}?action=getPengumuman`);
        const data = await res.json();
        const container = document.getElementById('list-pengumuman');
        if(!data.length) { container.innerHTML = '<p class="text-xs text-slate-500">Belum ada pengumuman.</p>'; return; }
        container.innerHTML = data.map(p => `
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
            <div class="flex justify-between items-start">
              <h4 class="font-bold text-sm text-teal-800">${p.judul}</h4>
              <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${formatDateIndo(p.tanggal)}</span>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed">${p.konten}</p>
          </div>
        `).join('');
      } catch(e) { console.error(e); }
    }

    async function loadMateri() {
      try {
        const res = await fetch(`${API_URL}?action=getMateri`);
        const data = await res.json();
        const container = document.getElementById('list-materi');
        if(!data.length) { container.innerHTML = '<p class="text-xs text-slate-500">Belum ada materi pembelajaran.</p>'; return; }
        
        container.innerHTML = data.map(m => {
          let embedUrl = m.videoUrl;
          if (m.videoUrl.includes('watch?v=')) {
            embedUrl = m.videoUrl.replace('watch?v=', 'embed/');
          }
          return `
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-teal-700 bg-teal-50 px-2 py-1 rounded border border-teal-200">${m.mapel}</span>
                <span class="text-[10px] text-slate-500">${formatDateIndo(m.tanggal)}</span>
              </div>
              <h4 class="font-bold text-sm text-slate-800">${m.judul}</h4>
              <div class="aspect-video w-full rounded-lg overflow-hidden bg-black">
                <iframe src="${embedUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
              </div>
              <p class="text-xs text-slate-600">${m.deskripsi}</p>
            </div>
          `;
        }).join('');
      } catch(e) { console.error(e); }
    }

    async function loadMutabaah() {
      try {
        const res = await fetch(`${API_URL}?action=getMutabaah&siswaId=${currentSiswa.id}`);
        const data = await res.json();
        const container = document.getElementById('list-mutabaah');
        if(!data.length) { container.innerHTML = '<p class="text-xs text-slate-500">Belum ada data mutaba\'ah.</p>'; return; }
        container.innerHTML = data.map(m => `
          <div class="p-3 bg-slate-50 rounded-lg border text-xs space-y-1">
            <div class="flex justify-between font-bold text-slate-700">
              <span>Tanggal</span>
              <span class="text-teal-700">${formatDateIndo(m.tanggal)}</span>
            </div>
            <div class="grid grid-cols-5 gap-1 text-[10px] pt-1 text-center">
              <span class="${m.subuh === 'Ya' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} p-1 rounded">Subuh: ${m.subuh}</span>
              <span class="${m.dzuhur === 'Ya' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} p-1 rounded">Dzuhur: ${m.dzuhur}</span>
              <span class="${m.ashar === 'Ya' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} p-1 rounded">Ashar: ${m.ashar}</span>
              <span class="${m.maghrib === 'Ya' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} p-1 rounded">Maghrib: ${m.maghrib}</span>
              <span class="${m.isya === 'Ya' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} p-1 rounded">Isya: ${m.isya}</span>
            </div>
          </div>
        `).join('');
      } catch(e) { console.error(e); }
    }

    async function handleSendIzin(e) {
      e.preventDefault();
      const payload = {
        action: 'addIzin',
        siswaId: currentSiswa.id,
        namaSiswa: currentSiswa.nama,
        tanggal: document.getElementById('iz-tanggal').value,
        jenis: document.getElementById('iz-jenis').value,
        alasan: document.getElementById('iz-alasan').value
      };
      await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      alert('Surat izin berhasil dikirim!');
      e.target.reset();
    }
  </script>
</body>
</html>
