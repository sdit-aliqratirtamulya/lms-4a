<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Guru - SD IT AL-IQRA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-20">

  <nav class="bg-teal-700 text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fas font-bold text-xl">🏫 Panel Wali Kelas</i>
      </div>
      <span class="text-xs bg-teal-800 px-3 py-1 rounded-full border border-teal-500">Kelas 4A</span>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-4">
    <!-- Navigation Tabs -->
    <div class="flex space-x-2 border-b border-slate-300 pb-2 mb-6 overflow-x-auto">
      <button onclick="switchTab('pengumuman')" id="tab-pengumuman" class="px-4 py-2 font-semibold rounded-lg bg-teal-700 text-white text-sm whitespace-nowrap">📢 Pengumuman</button>
      <button onclick="switchTab('materi')" id="tab-materi" class="px-4 py-2 font-semibold rounded-lg bg-white text-slate-600 text-sm whitespace-nowrap">📚 Materi</button>
      <button onclick="switchTab('mutabaah')" id="tab-mutabaah" class="px-4 py-2 font-semibold rounded-lg bg-white text-slate-600 text-sm whitespace-nowrap">📝 Input Mutaba'ah</button>
      <button onclick="switchTab('perizinan')" id="tab-perizinan" class="px-4 py-2 font-semibold rounded-lg bg-white text-slate-600 text-sm whitespace-nowrap">✉️ Surat Izin</button>
    </div>

    <!-- TAB 1: PENGUMUMAN -->
    <div id="sec-pengumuman" class="space-y-6">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-lg text-teal-800 mb-3"><i class="fas font-bold text-teal-600"></i> Buat Pengumuman Baru</h3>
        <form onsubmit="handlePengumuman(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Judul Pengumuman</label>
            <input type="text" id="p-judul" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Isi Pengumuman</label>
            <textarea id="p-konten" rows="3" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
          </div>
          <button type="submit" class="w-full bg-teal-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-teal-700">Publikasikan</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: MATERI -->
    <div id="sec-materi" class="space-y-6 hidden">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-lg text-teal-800 mb-3">Upload Materi & Link Video</h3>
        <form onsubmit="handleMateri(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Mata Pelajaran</label>
            <select id="m-mapel" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none">
              <option value="Matematika">Matematika</option>
              <option value="IPAS">IPAS</option>
              <option value="PAI">PAI</option>
              <option value="Bahasa Indonesia">Bahasa Indonesia</option>
              <option value="Bahasa Inggris">Bahasa Inggris</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Judul Materi</label>
            <input type="text" id="m-judul" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Link Video YouTube</label>
            <input type="url" id="m-url" placeholder="https://www.youtube.com/watch?v=..." required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Deskripsi Singkat</label>
            <textarea id="m-deskripsi" rows="2" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none"></textarea>
          </div>
          <button type="submit" class="w-full bg-teal-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-teal-700">Simpan Materi</button>
        </form>
      </div>
    </div>

    <!-- TAB 3: MUTABAAH -->
    <div id="sec-mutabaah" class="space-y-6 hidden">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-lg text-teal-800 mb-3">Input Mutaba'ah Siswa</h3>
        <form onsubmit="handleMutabaahGuru(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Tanggal</label>
            <input type="date" id="mg-tanggal" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Pilih Siswa</label>
            <select id="mg-siswa" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none">
              <option value="">-- Memuat Daftar Siswa --</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center space-x-2 bg-slate-50 p-2 rounded border"><input type="checkbox" id="mg-subuh" checked> <span>Subuh</span></label>
            <label class="flex items-center space-x-2 bg-slate-50 p-2 rounded border"><input type="checkbox" id="mg-dzuhur" checked> <span>Dzuhur</span></label>
            <label class="flex items-center space-x-2 bg-slate-50 p-2 rounded border"><input type="checkbox" id="mg-ashar" checked> <span>Ashar</span></label>
            <label class="flex items-center space-x-2 bg-slate-50 p-2 rounded border"><input type="checkbox" id="mg-maghrib" checked> <span>Maghrib</span></label>
            <label class="flex items-center space-x-2 bg-slate-50 p-2 rounded border"><input type="checkbox" id="mg-isya" checked> <span>Isya</span></label>
          </div>
          <button type="submit" class="w-full bg-teal-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-teal-700">Simpan Data Mutaba'ah</button>
        </form>
      </div>
    </div>

    <!-- TAB 4: PERIZINAN -->
    <div id="sec-perizinan" class="space-y-6 hidden">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-lg text-teal-800 mb-3">Daftar Surat Izin Masuk</h3>
        <div id="list-perizinan" class="space-y-3">
          <p class="text-sm text-slate-500">Memuat data perizinan...</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwVmfmObDSAeEHPEoRIysEDZkl_1vZtfhgp8WCVADMnwJOmT8yMdnl07JmTqRDtyrq8UA/exec";

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('mg-tanggal').value = new Date().toISOString().split('T')[0];
      fetchSiswa();
      fetchPerizinan();
    });

    function switchTab(tab) {
      ['pengumuman', 'materi', 'mutabaah', 'perizinan'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`tab-${t}`);
        if(t === tab) {
          btn.className = "px-4 py-2 font-semibold rounded-lg bg-teal-700 text-white text-sm whitespace-nowrap";
        } else {
          btn.className = "px-4 py-2 font-semibold rounded-lg bg-white text-slate-600 text-sm whitespace-nowrap";
        }
      });
    }

    function formatDateIndo(dateStr) {
      if (!dateStr || dateStr === '-') return '-';
      let cleanStr = String(dateStr).trim();
      if (cleanStr.includes('T')) cleanStr = cleanStr.split('T')[0];
      const parts = cleanStr.split('-');
      if (parts.length === 3) {
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10))
          .toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      }
      return dateStr;
    }

    async function fetchSiswa() {
      try {
        const res = await fetch(`${API_URL}?action=getSiswa`);
        const data = await res.json();
        const sel = document.getElementById('mg-siswa');
        sel.innerHTML = '<option value="">-- Pilih Siswa --</option>';
        data.forEach(s => {
          sel.innerHTML += `<option value="${s.id}">${s.id} - ${s.nama}</option>`;
        });
      } catch(e) { console.error(e); }
    }

    async function handlePengumuman(e) {
      e.preventDefault();
      const payload = {
        action: 'addPengumuman',
        judul: document.getElementById('p-judul').value,
        konten: document.getElementById('p-konten').value
      };
      await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      alert('Pengumuman Berhasil Dipublikasikan!');
      e.target.reset();
    }

    async function handleMateri(e) {
      e.preventDefault();
      const payload = {
        action: 'addMateri',
        mapel: document.getElementById('m-mapel').value,
        judul: document.getElementById('m-judul').value,
        videoUrl: document.getElementById('m-url').value,
        deskripsi: document.getElementById('m-deskripsi').value
      };
      await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      alert('Materi Berhasil Ditambahkan!');
      e.target.reset();
    }

    async function handleMutabaahGuru(e) {
      e.preventDefault();
      const payload = {
        action: 'addMutabaah',
        tanggal: document.getElementById('mg-tanggal').value,
        siswaId: document.getElementById('mg-siswa').value,
        subuh: document.getElementById('mg-subuh').checked ? 'Ya' : 'Belum',
        dzuhur: document.getElementById('mg-dzuhur').checked ? 'Ya' : 'Belum',
        ashar: document.getElementById('mg-ashar').checked ? 'Ya' : 'Belum',
        maghrib: document.getElementById('mg-maghrib').checked ? 'Ya' : 'Belum',
        isya: document.getElementById('mg-isya').checked ? 'Ya' : 'Belum'
      };
      await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      alert('Data Mutabaah Berhasil Disimpan!');
    }

    async function fetchPerizinan() {
      try {
        const res = await fetch(`${API_URL}?action=getPerizinan`);
        const data = await res.json();
        const container = document.getElementById('list-perizinan');
        if(!data.length) { container.innerHTML = '<p class="text-sm text-slate-500">Belum ada surat izin.</p>'; return; }
        container.innerHTML = data.map(item => `
          <div class="p-3 border rounded-lg bg-slate-50 text-sm">
            <div class="flex justify-between font-bold text-slate-700">
              <span>${item.namaSiswa} (${item.siswaId})</span>
              <span class="text-xs text-teal-600 bg-teal-50 px-2 py-0.5 rounded">${formatDateIndo(item.tanggal)}</span>
            </div>
            <div class="text-xs font-semibold text-amber-600 mt-1">Jenis: ${item.jenis}</div>
            <p class="text-xs text-slate-600 mt-1">${item.alasan}</p>
          </div>
        `).join('');
      } catch(e) { console.error(e); }
    }
  </script>
</body>
</html>
